<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf Builder | Professional Edition</title>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
    
    <style>
        /* Estetik ve Modern Tema */
        :root {
            --primary-color: #6366f1;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
        }

        body, html { height: 100%; margin: 0; background-color: var(--bg-dark); font-family: 'Inter', sans-serif; }

        /* Üst Header Kısmı */
        .top-nav {
            height: 50px;
            background: var(--panel-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            border-bottom: 1px solid #334155;
        }

        .logo { font-weight: bold; font-size: 1.2rem; color: var(--primary-color); }

        .nav-buttons { display: flex; gap: 10px; }

        .btn {
            padding: 6px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
            font-weight: 500;
        }

        .btn-save { background: var(--primary-color); color: white; }
        .btn-lang { background: #334155; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-1px); }

        /* GrapesJS Özelleştirme */
        .gjs-one-bg { background-color: var(--panel-bg) !important; }
        .gjs-two-color { color: #cbd5e1 !important; }
        .gjs-three-bg { background-color: var(--primary-color) !important; }
        .gjs-four-color { color: white !important; }
    </style>
</head>
<body>

    <header class="top-nav">
        <div class="logo">YUSUF BUILDER</div>
        <div class="nav-buttons">
            <button class="btn btn-lang" id="lang-btn" onclick="toggleLanguage()">🇬🇧 EN</button>
            <button class="btn btn-save" onclick="saveData()">💾 <span id="txt-save">Kaydet & İndir</span></button>
        </div>
    </header>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        let currentLang = 'tr';
        const translations = {
            tr: { save: "Kaydet & İndir", lang: "🇬🇧 EN", welcome: "Yusuf Builder'a Hoş Geldiniz" },
            en: { save: "Save & Download", lang: "🇹🇷 TR", welcome: "Welcome to Yusuf Builder" }
        };

        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 50px)',
            width: 'auto',
            storageManager: false,
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {
                    // Blok menülerini ve araçlarını burada özelleştirebilirsin
                }
            },
            // Estetik Renk Paleti
            canvas: {
                styles: ['https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap']
            }
        });

        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            
            // Arayüz yazılarını güncelle
            document.getElementById('txt-save').innerText = translations[currentLang].save;
            document.getElementById('lang-btn').innerText = translations[currentLang].lang;

            // GrapesJS Editör içindeki dili değiştir (GrapesJS I18N)
            editor.I18n.setLocale(currentLang);
            
            alert(currentLang === 'tr' ? "Dil Türkçe yapıldı!" : "Language switched to English!");
        }

        function saveData() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const fullCode = `<html><head><style>${css}</style></head><body>${html}</body></html>`;

            // İndirme işlemi
            const blob = new Blob([fullCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tasarim.html';
            a.click();
        }
    </script>
</body>
</html>
