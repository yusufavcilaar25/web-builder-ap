<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Studio | Pro Web Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <style>
        :root { --primary: #2563eb; --dark: #0f172a; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; background: #f1f5f9; }
        
        /* Navigasyon */
        .nav-header { height: 60px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 1000; position: relative; }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--dark); }
        .logo span { color: var(--primary); }

        /* Butonlar */
        .btn { padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid #ddd; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { background: #1d4ed8; }

        /* GrapesJS UI */
        .gjs-one-bg { background-color: #ffffff !important; }
        .gjs-two-color { color: #64748b !important; }
        .gjs-three-bg { background-color: var(--primary) !important; }
        .gjs-cv-canvas { background-color: #cbd5e1 !important; }
        
        /* Auth Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: white; padding: 30px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="nav-header">
        <div class="logo">YUSUF<span>STUDIO</span></div>
        <div id="auth-controls">
            {% if current_user.is_authenticated %}
                <span style="margin-right:10px;">Hoş geldin, {{ current_user.username }}</span>
                <button class="btn btn-primary" onclick="editor.store()">KAYDET</button>
                <a href="/logout"><button class="btn">Çıkış</button></a>
            {% else %}
                <button class="btn" onclick="openAuth('login')">Giriş</button>
                <button class="btn btn-primary" onclick="openAuth('register')">Kayıt Ol</button>
            {% endif %}
        </div>
    </div>

    <div id="gjs"></div>

    <div id="authModal" class="modal">
        <div class="modal-box">
            <h2 id="modalTitle">Giriş</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn btn-primary" style="width:100%;" onclick="submitAuth()">Onayla</button>
            <button onclick="closeAuth()" style="background:none; border:none; color:gray; margin-top:10px; cursor:pointer;">Kapat</button>
        </div>
    </div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            storageManager: {
                type: 'remote',
                stepsBeforeSave: 3,
                urlStore: '/auto-save',
                urlLoad: '/load-site',
                contentTypeJson: true,
            },
            plugins: ['gjs-preset-webpage'],
            canvas: {
                styles: ['https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap']
            }
        });

        // Üst Araç Çubuğuna Ekstra Fonksiyonlar
        const pn = editor.Panels;
        pn.addButton('options', {
            id: 'undo', className: 'fa fa-undo', command: 'core:undo', attributes: { title: 'Geri Al' }
        });
        pn.addButton('options', {
            id: 'redo', className: 'fa fa-redo', command: 'core:redo', attributes: { title: 'İleri Al' }
        });

        // Auth Mantığı
        let mode = 'login';
        function openAuth(m) { mode = m; document.getElementById('modalTitle').innerText = m === 'login' ? 'Giriş Yap' : 'Kayıt Ol'; document.getElementById('authModal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('authModal').style.display = 'none'; }
        
        async function submitAuth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/' + mode, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            if(res.ok) location.reload();
            else alert("Hata! Bilgilerini kontrol et.");
        }
    </script>
</body>
</html>
