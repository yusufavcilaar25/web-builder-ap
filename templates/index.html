<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Elite Studio | SaaS Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@400;700&family=Montserrat:wght@800&family=Playfair+Display:ital@1&family=Roboto+Mono&family=Lora&family=Oswald:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Navbar */
        .navbar { height: 60px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; z-index: 100; }
        .logo { font-weight: 800; color: var(--primary); font-family: 'Montserrat'; font-size: 1.2rem; }
        
        /* Auth Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 350px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-content h2 { margin-top: 0; font-family: 'Montserrat'; font-size: 1.2rem; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .auth-btn-group button { padding: 8px 16px; border-radius: 6px; border: 1px solid #ddd; cursor: pointer; font-weight: 500; margin-left: 5px; transition: 0.2s; }
        .btn-reg { background: var(--primary); color: white; border: none !important; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">YUSUF // STUDIO</div>
        <div class="auth-btn-group">
            {% if current_user.is_authenticated %}
                <span style="margin-right:10px;">👋 {{ current_user.username }}</span>
                <a href="/logout"><button>Çıkış</button></a>
            {% else %}
                <button onclick="openModal('login')">Giriş Yap</button>
                <button class="btn-reg" onclick="openModal('register')">Kayıt Ol</button>
            {% endif %}
        </div>
    </nav>

    <div id="authModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Giriş Yap</h2>
            <input type="text" id="username" placeholder="Kullanıcı Adı">
            <input type="password" id="password" placeholder="Şifre">
            <button class="modal-btn" onclick="submitAuth()">Onayla</button>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">İptal</button>
        </div>
    </div>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        let currentAuthMode = 'login';

        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            storageManager: {
                type: 'remote',
                stepsBeforeSave: 1,
                urlStore: '/auto-save',
                urlLoad: '/load-site',
                contentTypeJson: true,
            },
            plugins: ['gjs-preset-webpage'],
            // ... önceki kodların devamı ...
blockManager: {
    blocks: [
        {
            id: 'video-hero',
            label: '<i class="fa fa-play-circle"></i><br>Video Bölümü',
            category: 'Bölümler',
            content: `<section style="padding:100px 0; background:#000; color:white; text-align:center;">
                        <h2 style="margin-bottom:20px;">Tanıtım Videomuz</h2>
                        <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
                      </section>`
        },
        {
            id: 'team-section',
            label: '<i class="fa fa-users"></i><br>Ekip Kartları',
            category: 'Bileşenler',
            content: `<div style="display:flex; gap:20px; padding:50px; justify-content:center;">
                        <div style="text-align:center; flex:1;">
                            <div style="width:100px; height:100px; background:#ddd; border-radius:50%; margin:auto;"></div>
                            <h4>Yusuf Arda</h4><p>Lead Developer</p>
                        </div>
                        <div style="text-align:center; flex:1;">
                            <div style="width:100px; height:100px; background:#ddd; border-radius:50%; margin:auto;"></div>
                            <h4>Zeynep Kaya</h4><p>UI/UX Designer</p>
                        </div>
                      </div>`
        },
        {
            id: 'gallery-grid',
            label: '<i class="fa fa-images"></i><br>Resim Galerisi',
            category: 'Bileşenler',
            content: `<div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:20px;">
                        <div style="background:#eee; height:200px;"></div>
                        <div style="background:#eee; height:200px;"></div>
                        <div style="background:#eee; height:200px;"></div>
                      </div>`
        },
        // Daha önceki Hero, Pricing ve Footer bloklarını da burada tutmaya devam et...
    ]
}
        });

        // MODAL YÖNETİMİ
        function openModal(mode) {
            currentAuthMode = mode;
            document.getElementById('modalTitle').innerText = mode === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('authModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('authModal').style.display = 'none'; }

        async function submitAuth() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/' + currentAuthMode, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if(res.ok) location.reload();
            else alert("İşlem başarısız!");
        }

        editor.I18n.setLocale('tr');
    </script>
</body>
</html>
