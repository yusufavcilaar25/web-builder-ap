<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürükle Bırak Web Oluşturucu</title>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>
    
    <style>
        body, html { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #gjs { border: none; height: 100%; width: 100%; }
        .top-bar { 
            background-color: #2c3e50; 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .save-btn { 
            background-color: #27ae60; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .save-btn:hover { background-color: #2ecc71; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>Site Oluşturucu Paneli</div>
        <button class="save-btn" onclick="saveDesign()">Tasarımı Kaydet</button>
    </div>

    <div id="gjs"></div>

    <script>
        // GrapesJS Editörünü Başlat
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 40px)', // Üst barın yüksekliğini düş
            width: '100%',
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {
                    // Eklenti ayarları buraya eklenebilir
                }
            },
            storageManager: false // Kendi kaydetme mantığımızı kullanacağız
        });

        // Tasarımı Backend'e Gönder
        function saveDesign() {
            const html = editor.getHtml();
            const css = editor.getCss();
            
            fetch('/save', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ html: html, css: css })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            })
            .catch((error) => {
                console.error('Hata:', error);
                alert("Kaydetme işlemi başarısız oldu.");
            });
        }
    </script>

</body>
</html>
