<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Studio | Full Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
    <style>
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; }
        .navbar { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #e2e8f0; }
        .navbar-brand { font-weight: 600; color: #0f172a; }
        .btn-publish { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        
        /* Blokların sidebar'daki görünümü */
        .gjs-block {
            width: 100% !important;
            min-height: 80px !important;
            padding: 10px !important;
            border-radius: 4px !important;
            border: 1px solid #e2e8f0 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px !important;
            background-color: #f8fafc !important;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">YUSUF STUDIO v2.0</div>
        <button class="btn-publish" onclick="publish()">Yayınla / İndir</button>
    </nav>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            storageManager: false,
            i18n: { locale: 'tr' },
            plugins: ['gjs-preset-webpage'],
            blockManager: {
                appendTo: '', // Varsayılan yere ekle
                blocks: [
                    {
                        id: 'section',
                        label: '<b>Geniş Bölüm</b>',
                        category: 'Temel',
                        content: `<section style="padding: 50px 0; background: #f4f4f4; text-align: center;">
                                    <h1>Yeni Başlık</h1>
                                    <p>Buraya açıklama metninizi girebilirsiniz.</p>
                                  </section>`,
                    },
                    {
                        id: 'text',
                        label: 'Metin Kutusu',
                        category: 'Temel',
                        content: '<div style="padding: 10px;">Metin ekleyin...</div>',
                    },
                    {
                        id: 'image',
                        label: 'Resim',
                        category: 'Temel',
                        content: { type: 'image' },
                    },
                    {
                        id: 'button',
                        label: 'Şık Buton',
                        category: 'Bileşenler',
                        content: '<a href="#" style="display:inline-block; background:#2563eb; color:white; padding:10px 20px; border-radius:5px; text-decoration:none;">Tıkla</a>',
                    },
                    {
                        id: 'column-2',
                        label: '2 Kolonlu Düzen',
                        category: 'Düzen',
                        content: `<div style="display: flex; gap: 20px; padding: 20px;">
                                    <div style="flex: 1; min-height: 50px; border: 1px dashed #ccc;"></div>
                                    <div style="flex: 1; min-height: 50px; border: 1px dashed #ccc;"></div>
                                  </div>`,
                    },
                    {
                        id: 'navbar-simple',
                        label: 'Üst Menü',
                        category: 'Bileşenler',
                        content: `<nav style="display: flex; justify-content: space-between; padding: 20px; background: white; border-bottom: 1px solid #ddd;">
                                    <div>Logo</div>
                                    <div><a href="#">Ana Sayfa</a> | <a href="#">Hakkımızda</a></div>
                                  </nav>`,
                    }
                ]
            }
        });

        function publish() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const final = `<html><head><style>${css}</style></head><body>${html}</body></html>`;
            const blob = new Blob([final], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'site.html';
            a.click();
        }
    </script>
</body>
</html>
