<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSUF AI | WEB ARCHITECT</title>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-main: #00ff9d;
            --neon-alt: #0084ff;
            --deep-space: #020617;
            --panel-blur: rgba(15, 23, 42, 0.8);
        }

        body, html { height: 100%; margin: 0; background: var(--deep-space); font-family: 'Inter', sans-serif; overflow: hidden; color: white; }

        /* Hareketli Arka Plan Efekti */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
            z-index: -1;
        }

        /* Glassmorphism Header */
        .header-main {
            height: 70px;
            background: var(--panel-blur);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid rgba(0, 255, 157, 0.3);
            z-index: 1000;
        }

        .brand { font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 1.4rem; letter-spacing: 4px; color: var(--neon-main); text-shadow: 0 0 10px rgba(0, 255, 157, 0.5); }

        .controls { display: flex; gap: 20px; }

        .btn-ai {
            background: linear-gradient(45deg, var(--neon-main), var(--neon-alt));
            border: none; color: #000; padding: 10px 25px; border-radius: 50px;
            font-family: 'Syncopate', sans-serif; font-size: 0.7rem; font-weight: bold;
            cursor: pointer; transition: 0.3s all; text-transform: uppercase;
        }

        .btn-ai:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--neon-main); }

        /* GrapesJS UI Customize */
        .gjs-one-bg { background-color: #0f172a !important; }
        .gjs-two-color { color: #94a3b8 !important; }
        .gjs-three-bg { background-color: var(--neon-main) !important; color: #000 !important; }
        .gjs-four-color { color: var(--neon-main) !important; }
        
        /* Sağ paneldeki ayarların daha okunaklı olması için */
        .gjs-sm-sector-title { background-color: #1e293b !important; border-bottom: 1px solid #334155 !important; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header class="header-main">
        <div class="brand">YUSUF // ARCHITECT</div>
        <div class="controls">
            <button class="btn-ai" onclick="editor.runCommand('canvas-clear')">Sıfırla</button>
            <button class="btn-ai" onclick="exportBuild()">Deploy (Yayınla)</button>
        </div>
    </header>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 70px)',
            fromElement: true,
            storageManager: false,
            i18n: {
                locale: 'tr',
                messages: {
                    tr: {
                        blockManager: { labels: { 'Sections': 'Bloklar', 'Basic': 'Temel' }, categories: { 'Layout': 'Düzen', 'Components': 'Bileşenler', 'Extra': 'Ekstralar' } },
                        styleManager: { sectors: { 'general': 'Genel', 'layout': 'Yerleşim', 'typography': 'Yazı', 'decorations': 'Görünüm', 'extra': 'Ekstra' } },
                    }
                }
            },
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {
                    modalImportTitle: 'Kodu İçe Aktar',
                    modalImportLabel: 'HTML/CSS Kodunuzu Buraya Yapıştırın',
                    textCleanCanvas: 'Tuvali temizlemek istediğinize emin misiniz?'
                }
            }
        });

        editor.I18n.setLocale('tr');

        // Gelişmiş "Deploy" Simülasyonu
        function exportBuild() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const fullCode = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>${css}</style>
                </head>
                <body>${html}</body>
                </html>`;
            
            // Kullanıcıya şık bir bildirim
            const blob = new Blob([fullCode], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'yusuf-project-v1.html';
            a.click();
            
            alert("✅ Tasarım Optimize Edildi!\n🚀 Kodlar 'yusuf-project-v1.html' olarak indirildi.");
        }
    </script>
</body>
</html>
