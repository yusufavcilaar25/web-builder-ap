<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Builder | Pro Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    
    <style>
        :root { --primary: #2563eb; --accent: #f59e0b; --bg-canvas: #f8fafc; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Navbar Elite UI */
        .app-nav { height: 65px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
        .app-nav .brand { font-family: 'Montserrat'; font-size: 1.5rem; color: #1e293b; letter-spacing: -1px; }
        .app-nav .brand span { color: var(--primary); }
        
        /* Dashboard Buttons */
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid #e2e8f0; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; border: none; }
        .btn-primary:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-box { background: white; padding: 40px; border-radius: 20px; width: 400px; text-align: center; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        /* GrapesJS UI */
        .gjs-one-bg { background-color: #ffffff !important; }
        .gjs-two-color { color: #64748b !important; }
        .gjs-three-bg { background-color: var(--primary) !important; }
        .gjs-cv-canvas { background-color: var(--bg-canvas) !important; }
    </style>
</head>
<body>

    <nav class="app-nav">
        <div class="brand">YUSUF<span>STUDIO</span></div>
        <div class="actions">
            {% if current_user.is_authenticated %}
                <span style="margin-right:15px; font-size: 14px;">Aktif: <b>{{ current_user.username }}</b></span>
                <button class="btn btn-primary" onclick="editor.store()">YAYINLA</button>
                <a href="/logout"><button class="btn">Çıkış</button></a>
            {% else %}
                <button class="btn" onclick="openAuth('login')">Giriş</button>
                <button class="btn btn-primary" onclick="openAuth('register')">Ücretsiz Katıl</button>
            {% endif %}
        </div>
    </nav>

    <div id="authModal" class="modal">
        <div class="modal-box">
            <h2 id="modalTitle">Hoş Geldiniz</h2>
            <input type="text" id="userIn" placeholder="Kullanıcı Adı">
            <input type="password" id="passIn" placeholder="Şifre">
            <button class="btn btn-primary" style="width:100%; margin-top:20px;" onclick="doAuth()">Devam Et</button>
            <p style="margin-top:15px; cursor:pointer; color: #64748b;" onclick="closeAuth()">Kapat</p>
        </div>
    </div>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        let currentMode = 'login';
        
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 65px)',
            fromElement: true,
            storageManager: {
                type: 'remote',
                stepsBeforeSave: 1,
                urlStore: '/auto-save',
                urlLoad: '/load-site',
                contentTypeJson: true,
            },
            assetManager: {
                assets: [
                    {src: 'https://images.unsplash.com/photo-1498050108023-c5249f4df085', name: 'Tech'},
                    {src: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f', name: 'Business'},
                    {src: 'https://images.unsplash.com/photo-1557804506-669a67965ba0', name: 'Success'}
                ],
            },
            plugins: ['gjs-preset-webpage'],
            i18n: { locale: 'tr' }
        });

        // OTOMATİK KARŞILAMA VE REHBER
        editor.on('load', () => {
            if (!editor.getHtml() || editor.getHtml() === '<body></body>') {
                editor.setComponents(`
                    <div style="padding: 100px 20px; text-align: center; border: 3px dashed #e2e8f0; margin: 40px; border-radius: 30px;">
                        <i class="fa-solid fa-wand-magic-sparkles" style="font-size: 50px; color: #2563eb; margin-bottom: 20px;"></i>
                        <h1 style="color: #1e293b; font-family: 'Inter';">Harika Bir Şey Tasarla</h1>
                        <p style="color: #64748b;">Sol taraftaki blokları buraya sürükleyerek başla.</p>
                    </div>
                `);
            }
        });

        // AUTH İŞLEMLERİ
        function openAuth(m) {
            currentMode = m;
            document.getElementById('modalTitle').innerText = m === 'login' ? 'Giriş Yap' : 'Kayıt Ol';
            document.getElementById('authModal').style.display = 'flex';
        }
        function closeAuth() { document.getElementById('authModal').style.display = 'none'; }
        
        async function doAuth() {
            const username = document.getElementById('userIn').value;
            const password = document.getElementById('passIn').value;
            const res = await fetch('/' + currentMode, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if(res.ok) location.reload();
            else alert("İşlem başarısız, lütfen bilgileri kontrol et.");
        }
    </script>
</body>
</html>
