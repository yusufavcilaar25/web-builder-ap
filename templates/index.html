<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yusuf AI Builder | Next-Gen</title>
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs-preset-webpage/dist/grapesjs-preset-webpage.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
            --panel-bg: #111111;
        }

        body, html { height: 100%; margin: 0; background: var(--bg-dark); font-family: 'Inter', sans-serif; color: white; overflow: hidden; }

        /* Estetik Üst Panel */
        .header-pro {
            height: 60px;
            background: rgba(17, 17, 17, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .logo { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 1.5rem; 
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .action-btns { display: flex; gap: 15px; }

        .pro-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            transition: 0.4s;
        }

        .pro-btn:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* GrapesJS Estetik Overrides */
        .gjs-one-bg { background-color: var(--panel-bg) !important; }
        .gjs-two-color { color: #eee !important; }
        .gjs-three-bg { background-color: var(--neon-blue) !important; }
        .gjs-four-color { color: var(--neon-blue) !important; }
        .gjs-cv-canvas { background-image: radial-gradient(#222 1px, transparent 1px) !important; background-size: 20px 20px !important; }
    </style>
</head>
<body>

    <header class="header-pro">
        <div class="logo">YUSUF BUILDER AI</div>
        <div class="action-btns">
            <button class="pro-btn" onclick="editor.runCommand('canvas-clear')">TEMİZLE</button>
            <button class="pro-btn" onclick="saveCode()">İNDİR & KAYDET</button>
        </div>
    </header>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            fromElement: true,
            storageManager: false,
            // TÜRKÇELEŞTİRME PAKETİ
            i18n: {
                locale: 'tr',
                messages: {
                    tr: {
                        blockManager: { labels: { 'Sections': 'Bölümler', 'Basic': 'Temel Bloklar' }, categories: { 'Layout': 'Düzen', 'Components': 'Bileşenler' } },
                        deviceManager: { device: 'Cihaz' },
                        panels: { buttons: { titles: { 'preview': 'Önizleme', 'fullscreen': 'Tam Ekran' } } },
                        selectorManager: { label: 'Sınıflar', selected: 'Seçili' },
                        styleManager: { sectors: { 'general': 'Genel', 'layout': 'Yerleşim', 'typography': 'Yazı Tipi', 'decorations': 'Dekorasyon' } },
                        traitManager: { label: 'Ayarlar' }
                    }
                }
            },
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: { 'gjs-preset-webpage': {} }
        });

        // Editörü tam Türkçe moduna zorla
        editor.I18n.setLocale('tr');

        function saveCode() {
            const code = `<html><head><style>${editor.getCss()}</style></head><body>${editor.getHtml()}</body></html>`;
            const blob = new Blob([code], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'yusuf-tasarim.html';
            a.click();
            
            // Sunucuya da sessizce gönder
            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: editor.getHtml(), css: editor.getCss() })
            });
        }
    </script>
</body>
</html>
