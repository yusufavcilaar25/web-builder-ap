<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Studio | Pro Architect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Editör Renk Paleti (Dark Theme) */
        .gjs-one-bg { background-color: #1e293b !important; }
        .gjs-two-color { color: #f8fafc !important; }
        .gjs-three-bg { background-color: var(--primary) !important; }
        .gjs-four-color { color: var(--primary) !important; }

        header { 
            height: 55px; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        .btn-clear { background:#ef4444; border:none; color:white; padding:7px 15px; border-radius:6px; cursor:pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800; font-size: 1.2rem;">YUSUF <span style="color:var(--primary)">STUDIO</span></div>
        <div id="auth-check">
            <button class="btn-clear" onclick="if(confirm('Tüm tasarımı silmek istediğine emin misin?')) editor.runCommand('core:canvas-clear')">Sıfırla</button>
        </div>
    </header>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 55px)',
            fromElement: true,
            storageManager: { type: 'none' }, // Şimdilik hata vermemesi için local
            plugins: ['gjs-preset-webpage'],
            // PANELDEKİ BLOKLAR BURADA TANIMLANIYOR
            blockManager: {
                blocks: [
                    {
                        id: 'section-hero',
                        label: '<i class="fa fa-desktop"></i><br>Hero Alanı',
                        category: 'Bölümler',
                        content: `<section style="padding: 80px 20px; text-align: center; background: #ffffff; border-bottom: 1px solid #eee;">
                                    <h1 style="font-size: 3.5rem; color: #1e293b; margin-bottom: 15px;">Hayalindeki Siteyi Kur</h1>
                                    <p style="font-size: 1.2rem; color: #64748b; max-width: 700px; margin: 0 auto 30px;">Yusuf Studio ile sürükle ve bırak teknolojisinin keyfini çıkarın.</p>
                                    <button style="background: #3b82f6; color: white; padding: 15px 35px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Hemen Dene</button>
                                  </section>`,
                    },
                    {
                        id: 'features-grid',
                        label: '<i class="fa fa-th-large"></i><br>Özellikler',
                        category: 'Bölümler',
                        content: `<div style="display: flex; flex-wrap: wrap; padding: 50px; justify-content: center; gap: 20px;">
                                    <div style="flex: 1; min-width: 250px; padding: 30px; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center;">
                                        <i class="fa fa-bolt" style="font-size: 40px; color: #3b82f6; margin-bottom: 15px;"></i>
                                        <h3>Hızlı Altyapı</h3>
                                        <p>En son teknolojilerle optimize edildi.</p>
                                    </div>
                                    <div style="flex: 1; min-width: 250px; padding: 30px; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center;">
                                        <i class="fa fa-shield" style="font-size: 40px; color: #3b82f6; margin-bottom: 15px;"></i>
                                        <h3>Güvenli</h3>
                                        <p>Verileriniz her zaman koruma altında.</p>
                                    </div>
                                  </div>`,
                    },
                    {
                        id: 'simple-text',
                        label: '<i class="fa fa-align-left"></i><br>Yazı Bloğu',
                        category: 'İçerik',
                        content: '<div style="padding: 20px; line-height: 1.6; color: #334155;">Buraya dilediğiniz açıklamayı yazın...</div>',
                    },
                    {
                        id: 'image-element',
                        label: '<i class="fa fa-image"></i><br>Resim',
                        category: 'Medya',
                        content: { type: 'image' },
                    },
                    {
                        id: 'footer-pro',
                        label: '<i class="fa fa-minus"></i><br>Alt Bilgi',
                        category: 'Bölümler',
                        content: `<footer style="padding: 30px; background: #0f172a; color: #94a3b8; text-align: center; font-size: 14px;">
                                    <p>© 2026 Yusuf Studio. Tüm hakları saklıdır.</p>
                                  </footer>`,
                    }
                ]
            }
        });

        // Sayfa açıldığında sağdaki blok panelini otomatik aktif et
        editor.on('load', () => {
            const openBlocksBtn = editor.Panels.getButton('views', 'open-blocks');
            if (openBlocksBtn) openBlocksBtn.set('active', 1);
            
            // Editör tuvaline başlangıç rehberi ekle
            editor.setComponents(`
                <div style="padding: 50px; text-align: center; border: 2px dashed #cbd5e1; margin: 40px; border-radius: 20px; color: #94a3b8;">
                    <h2>Tasarımına Başla!</h2>
                    <p>Sağ taraftaki blokları buraya sürükle ve bırak.</p>
                </div>
            `);
        });

        // Türkçe dil desteği
        editor.I18n.setLocale('tr');
    </script>
</body>
</html>
