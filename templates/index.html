<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Yusuf Studio | Elite Web Architect</title>
    <meta name="description" content="Kod yazmadan hayalindeki web sitesini tasarla ve anında indir.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    
    <style>
        :root { --primary: #3b82f6; --dark: #0f172a; --panel: #1e293b; --text: #f8fafc; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; background-color: var(--dark); }
        
        /* Elite Dark Mode Navbar */
        .studio-nav { height: 60px; background: var(--panel); border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; color: white; }
        .logo { font-weight: 800; font-family: 'Montserrat'; font-size: 1.3rem; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        
        /* Gelişmiş Araç Çubuğu */
        .toolbar { display: flex; gap: 8px; align-items: center; background: #0f172a; padding: 5px 10px; border-radius: 8px; }
        .tool-btn { background: transparent; color: #94a3b8; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .tool-btn:hover { background: #334155; color: white; }
        
        .action-group { display: flex; gap: 10px; align-items: center; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-main:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 1px solid #475569; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        /* GrapesJS UI Dark Theme Customization */
        .gjs-one-bg { background-color: var(--panel) !important; }
        .gjs-two-color { color: #cbd5e1 !important; }
        .gjs-three-bg { background-color: var(--primary) !important; }
        .gjs-four-color { color: var(--primary) !important; }
        .gjs-cv-canvas { background-color: #e2e8f0 !important; } /* Tuval arka planı açık renk kalsın */
        
        /* Modal Stilleri */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-box { background: var(--panel); color: white; padding: 30px; border-radius: 12px; width: 350px; text-align: center; border: 1px solid #334155; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <nav class="studio-nav">
        <div class="logo">YUSUF <span>STUDIO</span></div>
        
        <div class="toolbar">
            <button class="tool-btn" onclick="editor.runCommand('core:undo')" title="Geri Al"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="tool-btn" onclick="editor.runCommand('core:redo')" title="İleri Al"><i class="fa-solid fa-rotate-right"></i></button>
            <div style="width: 1px; height: 20px; background: #334155; margin: 0 5px;"></div>
            <button class="tool-btn" onclick="editor.runCommand('core:component-outline')" title="Sınırları Göster"><i class="fa-regular fa-square"></i></button>
            <button class="tool-btn" onclick="editor.runCommand('core:preview')" title="Tam Ekran Önizleme"><i class="fa-solid fa-eye"></i></button>
            <button class="tool-btn" onclick="editor.runCommand('core:open-code')" title="HTML/CSS Kodunu Gör"><i class="fa-solid fa-code"></i></button>
        </div>

        <div class="action-group">
            {% if current_user.is_authenticated %}
                <span style="color: #94a3b8; font-size: 14px; margin-right: 10px;">{{ current_user.username }}</span>
                <button class="btn-main" onclick="editor.runCommand('gjs-export-zip')"><i class="fa-solid fa-download"></i> Siteyi İndir</button>
                <a href="/logout"><button class="btn-outline"><i class="fa-solid fa-right-from-bracket"></i></button></a>
            {% else %}
                <button class="btn-outline" onclick="auth('login')">Giriş Yap</button>
                <button class="btn-main" onclick="auth('register')">Ücretsiz Başla</button>
            {% endif %}
        </div>
    </nav>

    <div id="authModal" class="modal">
        <div class="modal-box">
            <h2 id="modalTitle" style="font-family: 'Montserrat';">Sisteme Gir</h2>
            <input type="text" id="userIn" placeholder="Kullanıcı Adı">
            <input type="password" id="passIn" placeholder="Şifre">
            <button class="btn-main" style="width:100%; justify-content:center; margin-top:15px; padding:12px;" onclick="doAuth()">ONAYLA</button>
            <p style="margin-top:15px; cursor:pointer; color: #64748b; font-size: 14px;" onclick="closeAuth()">İptal</p>
        </div>
    </div>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        // GrapesJS Başlatma
        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            showOffsets: true,
            noticeOnUnload: false,
            storageManager: {
                type: 'remote',
                stepsBeforeSave: 1,
                urlStore: '/auto-save',
                urlLoad: '/load-site',
                contentTypeJson: true,
            },
            canvas: {
                styles: ['https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap']
            },
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {
                    modalImportTitle: 'Kodu İçeri Aktar',
                    modalImportLabel: 'Kendi HTML/CSS kodunuzu buraya yapıştırın',
                    modalImportButton: 'İçeri Aktar',
                }
            },
            i18n: { locale: 'tr' }
        });

        // Ortadaki "Hoş Geldin" Boş Tuval Tasarımı
        editor.on('load', () => {
            if(!editor.getHtml() || editor.getHtml() === '<body></body>') {
                editor.setComponents(`
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background-color:#f8fafc; font-family:'Inter', sans-serif;">
                        <div style="text-align:center; padding:50px; background:white; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.05); max-width:600px;">
                            <h1 style="color:#0f172a; margin-bottom:15px;">Yeni Projeye Başla</h1>
                            <p style="color:#64748b; font-size:1.1rem; line-height:1.6;">Sağ paneldeki blokları (ikona tıklayarak açabilirsiniz) buraya sürükleyin ve tasarımınızı oluşturun.</p>
                        </div>
                    </div>
                `);
            }
        });

        // Auth Scriptleri
        let currentMode = 'login';
        function auth(m) {
            currentMode = m;
            document.getElementById('modalTitle').innerText = m === 'login' ? 'Giriş Yap' : 'Hesap Oluştur';
            document.getElementById('authModal').style.display = 'flex';
        }
        function closeAuth() { document.getElementById('authModal').style.display = 'none'; }
        
        async function doAuth() {
            const username = document.getElementById('userIn').value;
            const password = document.getElementById('passIn').value;
            const res = await fetch('/' + currentMode, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if(res.ok) location.reload();
            else alert("İşlem başarısız!");
        }
    </script>
</body>
</html>
