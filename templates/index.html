<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Studio | Force Load</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <style>
        body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        #gjs { height: calc(100vh - 40px) !important; }
        .top-bar { height: 40px; background: #1e293b; color: white; display: flex; align-items: center; padding: 0 20px; font-weight: bold; }
        /* Panel renklerini zorla değiştiriyoruz */
        .gjs-pn-views-container { border-left: 1px solid #334155 !important; background-color: #1e293b !important; }
        .gjs-block { width: 100% !important; min-height: 80px !important; background: #334155 !important; color: white !important; border: 1px solid #475569 !important; }
    </style>
</head>
<body>

    <div class="top-bar">YUSUF STUDIO 2026 - TASARIM MODU</div>
    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            fromElement: true,
            height: '100%',
            storageManager: false, // Hata vermemesi için tamamen kapattım
            blockManager: {
                appendTo: '#gjs-blocks', // Blokları buraya zorla
                blocks: [
                    {
                        id: 'section',
                        label: '<b>Kutu Bölümü</b>',
                        attributes: { class:'gjs-fonts gjs-f-b1' },
                        content: `<section style="padding:50px; background:#fff; text-align:center;">
                                    <h1>Başlık Buraya</h1>
                                    <p>İçerik buraya...</p>
                                  </section>`,
                    },
                    {
                        id: 'text',
                        label: 'Metin',
                        content: '<div style="padding:10px;">Metin ekleyin...</div>',
                    },
                    {
                        id: 'image',
                        label: 'Resim',
                        select: true,
                        content: { type: 'image' },
                    }
                ]
            }
        });

        // Blok panelini sağda zorla açan komut
        editor.on('load', () => {
            editor.Panels.getButton('views', 'open-blocks').set('active', true);
        });
    </script>
</body>
</html>
