<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Yusuf Studio | Sürükle Bırak Web Sitesi Kurucu</title>
    <meta name="description" content="Yusuf Studio ile kod yazmadan profesyonel, modern ve SEO uyumlu web siteleri tasarlayın. Ücretsiz kayıt olun ve hemen başlayın.">
    <meta name="keywords" content="web builder, site kurucu, sürükle bırak, no-code, yusuf studio">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yusuf-web-builder.onrender.com/">
    <meta property="og:title" content="Yusuf Studio | Profesyonel Web Tasarım Platformu">
    <meta property="og:description" content="Kendi web siteni dakikalar içinde tasarla.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=1200">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Yusuf Studio | Web Builder">
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1055/1055666.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    
    <style>
        :root { --primary: #2563eb; --slate: #1e293b; }
        body, html { height: 100%; margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        .navbar { height: 60px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; }
        .logo { font-weight: 800; color: var(--primary); font-size: 1.2rem; }
        
        /* Rehber & Karşılama Alanı */
        #welcome-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 5000; display: flex; align-items: center; justify-content: center; text-align: center; }
        .welcome-card { max-width: 500px; padding: 40px; }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; border: none; }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div class="welcome-card">
            <h1 style="color: var(--slate);">Yusuf Studio'ya Hoş Geldin! 🚀</h1>
            <p>Hayalindeki web sitesini kurmak için hazır mısın? Sol paneldeki blokları sürükle ve tasarlamaya başla.</p>
            <button class="btn btn-primary" onclick="startEditor()">Hemen Başla</button>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">YUSUF // STUDIO</div>
        <div class="auth">
            {% if current_user.is_authenticated %}
                <span>{{ current_user.username }}</span>
                <a href="/logout"><button class="btn">Çıkış</button></a>
            {% else %}
                <button class="btn" onclick="auth('login')">Giriş</button>
                <button class="btn btn-primary" onclick="auth('register')">Kayıt Ol</button>
            {% endif %}
        </div>
    </nav>

    <div id="gjs"></div>

    <script src="https://unpkg.com/grapesjs"></script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>

    <script>
        function startEditor() {
            document.getElementById('welcome-overlay').style.display = 'none';
        }

        const editor = grapesjs.init({
            container: '#gjs',
            height: 'calc(100vh - 60px)',
            storageManager: {
                type: 'remote',
                stepsBeforeSave: 1,
                urlStore: '/auto-save',
                urlLoad: '/load-site',
                contentTypeJson: true,
            },
            // VARSAYILAN ŞABLON (Boş Tuval Yerine)
            canvas: {
                styles: ['https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap'],
            },
            plugins: ['gjs-preset-webpage'],
        });

        // Giriş Yapılınca Şablonu Yükle
        editor.on('load', () => {
            if(!editor.getHtml() || editor.getHtml() === '<body></body>') {
                editor.setComponents(`
                    <header style="padding: 100px 20px; text-align: center; background: #f8fafc;">
                        <h1 style="font-size: 3rem;">Yeni Projeniz</h1>
                        <p>Burayı dilediğiniz gibi düzenleyebilir veya yeni bloklar ekleyebilirsiniz.</p>
                    </header>
                `);
            }
        });

        async function auth(type) {
            const user = prompt("Kullanıcı Adı:");
            const pass = prompt("Şifre:");
            const res = await fetch('/' + type, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            if(res.ok) location.reload();
            else alert("Hata oluştu!");
        }
    </script>
</body>
</html>
