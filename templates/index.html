<!<DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yusuf Web Builder Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/grapesjs/dist/css/grapes.min.css">
    <script src="https://unpkg.com/grapesjs"></script>
    <style>
        body, html { height: 100%; margin: 0; }
        #gjs { height: 0px; overflow: hidden; }
        /* Panel ve Buton Stilleri */
        .panel__devices { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; }
        .save-btn { 
            position: absolute; top: 10px; right: 20px; z-index: 100;
            background: #27ae60; color: white; border: none; padding: 10px 20px; 
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .save-btn:hover { background: #2ecc71; }
    </style>
</head>
<body>

    <div class="panel__devices"></div>
    <button class="save-btn" onclick="saveContent()">💾 Tasarımı Kaydet & İndir</button>
    <div id="gjs"></div>

    <script>
        const editor = grapesjs.init({
            container: '#gjs',
            fromElement: true,
            height: '100vh',
            width: 'auto',
            storageManager: false, // Şimdilik yerel kayıt kapalı
            blockManager: {
                appendTo: '#blocks',
                blocks: [
                    {
                        id: 'section', 
                        label: '<b>Bölüm</b>', 
                        attributes: { class: 'gjs-block-section' },
                        content: `<section style="padding: 50px; text-align: center;"><h1>Yeni Bölüm</h1><p>Burası açıklama alanı...</p></section>`
                    },
                    {
                        id: 'text',
                        label: 'Metin',
                        content: '<div data-gjs-type="text">Metninizi buraya yazın</div>',
                    },
                    {
                        id: 'image',
                        label: 'Resim',
                        select: true,
                        content: { type: 'image' },
                        activate: true,
                    }
                ]
            },
            // Hazır blok setlerini (Navbar vb.) otomatik yüklemek için:
            plugins: ['gjs-preset-webpage'],
            pluginsOpts: {
                'gjs-preset-webpage': {}
            }
        });

        // HTML İndirme ve Sunucuya Gönderme Fonksiyonu
        function saveContent() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const fullCode = `<html><head><style>${css}</style></head><body>${html}</body></html>`;

            // 1. Sunucuya Gönder (Python'a)
            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ html: html, css: css })
            }).then(res => alert("Sunucuya kaydedildi!"));

            // 2. Dosya Olarak İndir (Senin seveceğin kısım)
            const blob = new Blob([fullCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }
    </script>
    <script src="https://unpkg.com/grapesjs-preset-webpage"></script>
</body>
</html>
